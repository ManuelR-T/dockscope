name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.filter.outputs.plugins }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect plugin-related changes
        id: filter
        run: |
          # Paths whose changes require re-running the plugin jobs. Includes the
          # workflow itself so changes to the plugin jobs are exercised.
          PATTERNS='^(plugins/|src/plugins/|src/plugin-sdk|schemas/|scripts/build-plugin-catalog\.mjs|\.github/workflows/ci\.yml)'

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # New branch, force push, or unknown base: can't diff, so run to be safe.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No usable base ref ($BASE); running plugin jobs."
            echo "plugins=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE "$PATTERNS"; then
            echo "Plugin-related changes detected."
            echo "plugins=true" >> "$GITHUB_OUTPUT"
          else
            echo "No plugin-related changes; skipping plugin jobs."
            echo "plugins=false" >> "$GITHUB_OUTPUT"
          fi

  commitlint:
    name: Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate commits
        env:
          # env indirection prevents script injection via commit messages
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
          else
            BEFORE="${{ github.event.before }}"
            # "before" is unusable on new branches and force pushes
            if [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
              npx commitlint --from "$BEFORE" --to HEAD --verbose
            elif git rev-parse HEAD~1 >/dev/null 2>&1; then
              npx commitlint --from HEAD~1 --to HEAD --verbose
            else
              printf '%s\n' "$HEAD_COMMIT_MESSAGE" | npx commitlint --verbose
            fi
          fi

  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [commitlint, lint-format, typecheck, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          retention-days: 7

  plugin-compatibility:
    name: Plugin Compatibility (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: needs.changes.outputs.plugins == 'true'
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: Compile an external SDK v1 consumer
        run: npm run typecheck:plugin-compat
      - name: Verify published package contents
        run: npm pack --dry-run
      # The official plugin is a buildable package: its manifest and bundle only
      # exist after a build, so build it before pointing the checks at dist/.
      - name: Build official plugin
        working-directory: plugins/official/kubernetes
        run: |
          npm ci
          npm run build
      # `vite build` runs esbuild, which strips types without checking them, so
      # the build alone proves nothing about type safety.
      - name: Typecheck official plugin
        working-directory: plugins/official/kubernetes
        run: npm run typecheck
      - name: Lint official plugin
        working-directory: plugins/official/kubernetes
        run: npm run lint
      - name: Test official plugin
        working-directory: plugins/official/kubernetes
        run: npm test
      - name: Validate official plugin manifest
        run: >-
          node dist/cli.js plugin:validate
          --plugins plugins/official/kubernetes/dist
          --plugin-permissions all
      - name: Smoke test process-isolated official plugin
        run: >-
          node dist/cli.js plugin:test
          --plugins plugins/official/kubernetes/dist
          --plugin-permissions all
      # The command/graph scaffolds are what plugin authors start from, so an
      # SDK change that breaks them must fail CI rather than ship a dead template.
      - name: Verify plugin scaffold templates load
        run: |
          scaffold_dir="$(mktemp -d)"
          for template in command graph; do
            plugin_dir="${scaffold_dir}/${template}"
            node dist/cli.js plugin:init \
              --dir "$plugin_dir" \
              --id "scaffold.${template}" \
              --name "Scaffold ${template}" \
              --template "$template"
            node dist/cli.js plugin:test \
              --plugins "$plugin_dir" \
              --plugin-permissions all
          done

  plugin-kubernetes-e2e:
    name: Kubernetes Plugin (live cluster)
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: needs.changes.outputs.plugins == 'true'
    # The plugin's unit tests mock the Kubernetes client, so they cannot see
    # anything the API server decides. Bugs that shipped despite green unit
    # tests -- swapped log arguments, every PATCH rejected as the wrong content
    # type -- are only visible against a real cluster.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: Build official plugin
        working-directory: plugins/official/kubernetes
        run: |
          npm ci
          npm run build
      - name: Create cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: dockscope-e2e
          node_image: kindest/node:v1.34.0
      - name: Install metrics-server
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml
          # kind's kubelet serves a self-signed certificate, which metrics-server
          # rejects by default and then never reports a single sample.
          kubectl patch -n kube-system deployment metrics-server --type=json \
            -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl rollout status -n kube-system deployment/metrics-server --timeout=240s
      - name: Apply cluster fixture
        run: |
          kubectl apply -f scripts/k8s-e2e/fixture.yaml
          kubectl rollout status deployment/e2e-web --timeout=240s
          kubectl rollout status daemonset/e2e-agent --timeout=240s
      - name: Exercise the plugin against the cluster
        run: node scripts/k8s-e2e/smoke.mjs
      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get all --all-namespaces
          kubectl describe pods -n default
          kubectl logs -n kube-system deployment/metrics-server --tail=50 || true

  plugin-catalog:
    name: Official Plugin Catalog
    runs-on: ubuntu-latest
    needs: [build, plugin-compatibility, changes]
    if: needs.changes.outputs.plugins == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: Build signed smoke catalog
        run: >-
          env SOURCE_DATE_EPOCH=1783728000 npm run plugins:catalog --
          --out dist/plugin-catalog
          --dev-keys
          --require-signatures
      - name: Verify catalog signature
        run: >-
          node dist/cli.js plugin:catalog
          --catalog dist/plugin-catalog/catalog.json
          --trust dist/plugin-catalog/catalog-trust.json
      - name: Install and load official Kubernetes plugin
        run: |
          node dist/cli.js plugin:catalog:install official.kubernetes \
            --catalog dist/plugin-catalog/catalog.json \
            --catalog-trust dist/plugin-catalog/catalog-trust.json \
            --registry-dir /tmp/dockscope-plugin-registry
          node dist/cli.js plugin:test \
            --plugins /tmp/dockscope-plugin-registry/official.kubernetes \
            --plugin-permissions all
      - name: Verify reproducible catalog artifacts
        run: |
          SOURCE_DATE_EPOCH=1783728000 npm run plugins:catalog -- --out /tmp/plugin-catalog-a
          SOURCE_DATE_EPOCH=1783728000 npm run plugins:catalog -- --out /tmp/plugin-catalog-b
          diff --recursive /tmp/plugin-catalog-a /tmp/plugin-catalog-b
      - uses: actions/upload-artifact@v6
        with:
          name: official-plugin-catalog
          path: dist/plugin-catalog/
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
